<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="PaySat — Inicia sesión en tu cuenta de banca digital internacional">
  <meta name="theme-color" content="#0A2540">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>PaySat — Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-shell">
    <main class="login-container" role="main">

      <!-- Brand Header -->
      <header class="brand-header">
        <div class="brand-logo">
          <!-- Logo Icon: Stylized "P" with orbital ring representing satellite/global -->
          <svg class="brand-logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="40" height="40" rx="10" fill="#0A2540"/>
            <text x="10" y="28" font-family="Poppins, sans-serif" font-weight="700" font-size="22" fill="white">P</text>
            <ellipse cx="27" cy="16" rx="8" ry="3" stroke="#00D4AA" stroke-width="1.5" fill="none" transform="rotate(-25 27 16)"/>
            <circle cx="32" cy="13" r="2" fill="#00D4AA"/>
          </svg>
          <span class="brand-logo-text">Pay<span>Sat</span></span>
        </div>
        <h1 class="brand-title">Bienvenido de nuevo</h1>
        <p class="brand-subtitle">Accede a tu cuenta PaySat</p>
      </header>

      <!-- Login Card -->
      <section class="login-card" aria-label="Formulario de inicio de sesión">
        <form id="loginForm" novalidate autocomplete="on">

          <!-- Email Field -->
          <div class="form-group" id="emailGroup">
            <label class="form-label" for="emailInput">Correo electrónico</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="3"/>
                <polyline points="22,5 12,13 2,5"/>
              </svg>
              <input
                type="email"
                id="emailInput"
                class="form-input"
                placeholder="Ingresa tu correo electrónico"
                autocomplete="email"
                autocapitalize="none"
                spellcheck="false"
                inputmode="email"
                aria-describedby="emailError"
                aria-required="true"
              >
            </div>
            <div class="field-error" id="emailError" aria-live="polite">
              <svg class="field-error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              <span></span>
            </div>
          </div>

          <!-- Password Field -->
          <div class="form-group" id="passwordGroup">
            <label class="form-label" for="passwordInput">Contraseña</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                type="password"
                id="passwordInput"
                class="form-input password-input"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                autocapitalize="none"
                spellcheck="false"
                aria-describedby="passwordError"
                aria-required="true"
                minlength="6"
              >
              <button
                type="button"
                id="passwordToggle"
                class="password-toggle"
                aria-label="Mostrar contraseña"
                tabindex="0"
              >
                <!-- Eye icon (show) -->
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- Eye-off icon (hide) -->
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <div class="field-error" id="passwordError" aria-live="polite">
              <svg class="field-error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              <span></span>
            </div>
          </div>

          <!-- Remember / Forgot -->
          <div class="form-extras">
            <label class="checkbox-wrapper" for="rememberCheckbox">
              <input type="checkbox" id="rememberCheckbox" class="checkbox-input" aria-label="Recordarme">
              <span class="checkbox-visual">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </span>
              <span class="checkbox-label">Recordarme</span>
            </label>
            <button type="button" id="forgotLink" class="forgot-link">
              ¿Olvidaste tu contraseña?
            </button>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submitBtn" class="btn-submit">
            <span class="btn-text">Iniciar sesión</span>
            <!-- Spinner -->
            <svg class="btn-spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>
              <path d="M12 2a10 10 0 0 1 10 10" stroke="white" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <!-- Success check -->
            <svg class="btn-success-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </button>

        </form>
      </section>

      <!-- Security Footer -->
      <footer class="security-footer">
        <svg class="security-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span class="security-text">Tu información está protegida</span>
      </footer>

    </main>
  </div>

  <!-- Success Overlay -->
  <div class="success-overlay" id="successOverlay" role="status" aria-live="polite">
    <div class="success-overlay-content">
      <div class="success-check-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <p class="success-overlay-title">Inicio de sesión exitoso</p>
      <p class="success-overlay-subtitle">Redirigiendo a tu cuenta...</p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Recuperar contraseña">
    <div class="modal-sheet">
      <div class="modal-handle" aria-hidden="true"></div>
      <h2 class="modal-title">Recuperar contraseña</h2>
      <p class="modal-description">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
      <div class="modal-input-group">
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <polyline points="22,5 12,13 2,5"/>
          </svg>
          <input
            type="email"
            id="modalEmailInput"
            class="form-input"
            placeholder="Ingresa tu correo electrónico"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            inputmode="email"
            aria-label="Correo electrónico para recuperación"
          >
        </div>
      </div>
      <button type="button" id="modalSendBtn" class="modal-btn">Enviar enlace</button>
      <button type="button" id="modalCloseBtn" class="modal-close">Cancelar</button>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
